name: "質問 / 困っています"
description: "研修中に詰まったときに使ってください"
title: "質問: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        質問は歓迎です。ただし **答える側が状況を再現できる形**で書いてください。
        これは実務でも同じで、「動きません」だけでは誰も助けられません。

        まず [docs/06-troubleshooting.md](https://github.com/Lumos-Programming/github-practice/blob/main/docs/06-troubleshooting.md) を確認してみてください。

  - type: textarea
    id: what
    attributes:
      label: 何をしようとしていましたか
      placeholder: "実習1のStep 11でPushしようとしていました。"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 実行したコマンド
      render: shell
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 表示されたメッセージ（全文）
      description: 一部だけでなく全文を貼ってください。エラーの本文に答えが書いてあることがよくあります。
      render: shell
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: git status の出力
      render: shell
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: git log --oneline --graph --all の出力
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: tried
    attributes:
      label: 確認したこと
      options:
        - label: "`git status` を読んだ"
        - label: "`git branch` で自分がどのBranchにいるか確認した"
        - label: "エラーメッセージを最後まで読んだ"
